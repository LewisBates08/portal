name: Delivery agent pipeline

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the planner and delivery agents
        required: true
        type: string

permissions:
  contents: read

jobs:
  delivery-pipeline:
    # Run only from the trusted default branch. This workflow uses an API key
    # and gives three agents permission to edit the checked-out project.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: portal
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: portal_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U portal -d portal_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://portal:ci-test-only@localhost:5432/portal_test
      DATABASE_URL: postgresql+psycopg://portal:ci-test-only@localhost:5432/portal_test
      JWT_SECRET: ci-only-signing-secret-not-for-deployment-12345678
      ENVIRONMENT: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install project dependencies
        run: |
          python -m pip install -r backend/requirements.lock -r backend/requirements-dev.txt
          npm ci --prefix frontend

      - name: Install Codex CLI
        run: npm install --global @openai/codex@0.164.0

      - name: Run delivery pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          PIPELINE_TASK: ${{ inputs.task }}
        run: python pipeline.py --task "$PIPELINE_TASK"

      - name: Collect agent changes
        if: always()
        run: |
          mkdir -p pipeline/agent-output
          git diff --binary HEAD > /tmp/agent-changes.patch
          git ls-files --others --exclude-standard -z \
            | tar --null -T - -czf /tmp/agent-untracked-files.tar.gz
          cp /tmp/agent-changes.patch pipeline/agent-output/changes.patch
          cp /tmp/agent-untracked-files.tar.gz pipeline/agent-output/untracked-files.tar.gz

      - name: Upload pipeline reports and changes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-pipeline-${{ github.run_id }}
          path: |
            pipeline/
            assessment/
          if-no-files-found: warn
          retention-days: 14
